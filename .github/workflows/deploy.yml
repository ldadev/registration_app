name: Deploy Astro to GitHub Pages

on:
  push:
    # 🌟 CORREGIDO: Usar 'master' según la rama confirmada
    branches:
      - master 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # 🔑 CORRECCIÓN CLAVE: Otorgar permiso explícito de escritura al bot 
    # Esto resuelve el error 403 (Permission denied)
    permissions:
      contents: write # Necesario para hacer push a la rama gh-pages

    steps:
      # Paso 1: Checkout del código
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Usamos el GITHUB_TOKEN estándar; el permiso de escritura ya se otorgó arriba
          token: ${{ secrets.GITHUB_TOKEN }} 
      
      # Paso 2: Configurar Node.js 20
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: npm
          
      # Paso 3: Instalar dependencias
      - name: Install dependencies
        run: npm install
        
      # Paso 4: Ejecutar la compilación de Astro (Crea la carpeta dist)
      - name: Build Astro project
        run: npm run build
        
      # Paso 5: Crea el archivo .nojekyll (Esencial para Astro en gh-pages)
      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      # Paso 6: Desplegar a GitHub Pages con peaceiris (Método probado)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # El token ya tiene permiso de escritura gracias a la sección 'permissions'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Especifica la rama de despliegue
          publish_branch: gh-pages
          # Especifica la carpeta de la que se debe desplegar
          publish_dir: ./dist
          # Fuerza la actualización de la rama gh-pages
          force_orphan: true